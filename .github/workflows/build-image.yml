name: build-image

# 触发条件：
#   - GitHub Release 发布后构建并推 GHCR
#   - 手动触发：从 VERSION 文件读版本号，用于本地/维护调试
# 不用任何额外 secret，GITHUB_TOKEN 自动可用
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      push_latest:
        description: '手动触发时是否同时推 latest tag'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write   # 写 GHCR 必需

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/afterglow

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # release 事件用 release tag；手动触发才读 VERSION 文件。
      - name: Read VERSION
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            raw="${{ github.event.release.tag_name }}"
            prerelease="${{ github.event.release.prerelease }}"
          else
            raw="$(cat VERSION)"
            prerelease="false"
          fi

          version="${raw#v}"
          {
            echo "raw=${raw}"
            echo "version=${version}"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 自动生成镜像 tag：
      #   - 正式发布 v0.2.3 → 0.2.3, 0.2, latest
      #   - prerelease 不推 latest
      #   - workflow_dispatch → VERSION 文件值；可选 latest
      - name: Resolve image tags
        id: tags
        shell: bash
        run: |
          version="${{ steps.ver.outputs.version }}"
          prerelease="${{ steps.ver.outputs.prerelease }}"
          tags=("${IMAGE}:${version}")

          if [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            tags+=("${IMAGE}:${BASH_REMATCH[1]}.${BASH_REMATCH[2]}")
          fi

          if [[ "${{ github.event_name }}" == "release" && "$prerelease" != "true" ]]; then
            tags+=("${IMAGE}:latest")
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.push_latest }}" == "true" ]]; then
            tags+=("${IMAGE}:latest")
          fi

          {
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            PYTHON_VERSION=3.12
            UV_VERSION=0.5
